# Original DualPath Mamba S + masked JEPA, static LibriMix data.
seed: 1234
__set_seed: !apply:torch.manual_seed [!ref <seed>]
eval_only: false
dataset: librimix
# Root containing wav8k/min/train-100, dev and test (e.g. Libri2Mix).
data_folder: !PLACEHOLDER
librimix_train_split: train-100
librimix_version: min
# False uses official metadata and checks one WAV pair per split at preparation.
librimix_validate_audio: True
base_folder_dm: null
project: Mamba-TasNet
experiment: dpmamba_S_jepa
output_folder: !ref results/LibriMix/<experiment>/<seed>
train_log: !ref <output_folder>/train_log.txt
save_folder: !ref <output_folder>/save
train_data: !ref <save_folder>/libri<num_spks>mix_<librimix_train_split>.csv
valid_data: !ref <save_folder>/libri<num_spks>mix_dev.csv
test_data: !ref <save_folder>/libri<num_spks>mix_test.csv
skip_prep: False
precision: bf16
num_spks: 2
noprogressbar: False
save_audio: True
n_audio_to_save: 20
sample_rate: 8000
N_epochs: 200
batch_size: 1
lr: 1.5e-4
weight_decay: 0
clip_grad_norm: 5
loss_upper_lim: 999999
limit_training_signal_len: False
training_signal_len: 32000000
n_warmup_step: 20000
# Uses existing mix_clean WAV files; does not alter the original dynamic mixer.
dynamic_mixing: False
use_wavedrop: False
use_speedperturb: True
use_rand_shift: False
min_shift: -8000
max_shift: 8000
speed_changes: [95, 100, 105]
speed_perturb: !new:speechbrain.augment.time_domain.SpeedPerturb
    orig_freq: !ref <sample_rate>
    speeds: !ref <speed_changes>
drop_freq_low: 0
drop_freq_high: 1
drop_freq_count_low: 1
drop_freq_count_high: 3
drop_freq_width: 0.05
drop_freq: !new:speechbrain.augment.time_domain.DropFreq
    drop_freq_low: !ref <drop_freq_low>
    drop_freq_high: !ref <drop_freq_high>
    drop_freq_count_low: !ref <drop_freq_count_low>
    drop_freq_count_high: !ref <drop_freq_count_high>
    drop_freq_width: !ref <drop_freq_width>
drop_chunk_count_low: 1
drop_chunk_count_high: 5
drop_chunk_length_low: 1000
drop_chunk_length_high: 2000
drop_chunk: !new:speechbrain.augment.time_domain.DropChunk
    drop_length_low: !ref <drop_chunk_length_low>
    drop_length_high: !ref <drop_chunk_length_high>
    drop_count_low: !ref <drop_chunk_count_low>
    drop_count_high: !ref <drop_chunk_count_high>
threshold_byloss: True
threshold: -40
N_encoder_out: 256
out_channels: 256
kernel_size: 16
kernel_stride: !ref <kernel_size> // 2
n_dp: 8
chunk_size: 250
skip_n_block: 0
skip_around_intra: False
bidirectional: True
n_mamba_dp: 2
ssm_dim: 16
mamba_expand: 2
mamba_conv: 4
dataloader_opts:
    batch_size: !ref <batch_size>
    num_workers: 16
    drop_last: True
fused_add_norm: False
rms_norm: True
residual_in_fp32: False
Encoder: !new:speechbrain.lobes.models.dual_path.Encoder
    kernel_size: !ref <kernel_size>
    out_channels: !ref <N_encoder_out>
Mambaintra: !new:modules.mamba_blocks.MambaBlocksSequential
    n_mamba: !ref <n_mamba_dp> // 2
    bidirectional: !ref <bidirectional>
    d_model: !ref <out_channels>
    d_state: !ref <ssm_dim>
    expand: !ref <mamba_expand>
    d_conv: !ref <mamba_conv>
    fused_add_norm: !ref <fused_add_norm>
    rms_norm: !ref <rms_norm>
    residual_in_fp32: !ref <residual_in_fp32>
Mambainter: !new:modules.mamba_blocks.MambaBlocksSequential
    n_mamba: !ref <n_mamba_dp> // 2
    bidirectional: !ref <bidirectional>
    d_model: !ref <out_channels>
    d_state: !ref <ssm_dim>
    expand: !ref <mamba_expand>
    d_conv: !ref <mamba_conv>
    fused_add_norm: !ref <fused_add_norm>
    rms_norm: !ref <rms_norm>
    residual_in_fp32: !ref <residual_in_fp32>
MaskNet: !new:speechbrain.lobes.models.dual_path.Dual_Path_Model
    num_spks: !ref <num_spks>
    in_channels: !ref <N_encoder_out>
    out_channels: !ref <out_channels>
    num_layers: !ref <n_dp>
    K: !ref <chunk_size>
    intra_model: !ref <Mambaintra>
    inter_model: !ref <Mambainter>
    norm: ln
    linear_layer_after_inter_intra: False
    skip_around_intra: !ref <skip_around_intra>
Decoder: !new:speechbrain.lobes.models.dual_path.Decoder
    in_channels: !ref <N_encoder_out>
    out_channels: 1
    kernel_size: !ref <kernel_size>
    stride: !ref <kernel_stride>
    bias: False
jepa_weight: 0.1
jepa_mask_ratio: 0.5
jepa_mask_span: 16
jepa_context_layers: 1
jepa_predictor_layers: 1
jepa_predictor_dim: 128
jepa_momentum: 0.996
jepa_momentum_end: 1.0
jepa_anneal_steps: !ref <N_epochs> * (20000 // <batch_size>)
JEPAContext: !new:modules.mamba_blocks.MambaBlocksSequential
    n_mamba: !ref <jepa_context_layers>
    bidirectional: !ref <bidirectional>
    d_model: !ref <N_encoder_out>
    d_state: !ref <ssm_dim>
    expand: !ref <mamba_expand>
    d_conv: !ref <mamba_conv>
    fused_add_norm: !ref <fused_add_norm>
    rms_norm: !ref <rms_norm>
    residual_in_fp32: !ref <residual_in_fp32>
JEPAPredictor: !new:modules.mamba_blocks.MambaBlocksSequential
    n_mamba: !ref <jepa_predictor_layers>
    bidirectional: !ref <bidirectional>
    d_model: !ref <jepa_predictor_dim>
    d_state: !ref <ssm_dim>
    expand: !ref <mamba_expand>
    d_conv: !ref <mamba_conv>
    fused_add_norm: !ref <fused_add_norm>
    rms_norm: !ref <rms_norm>
    residual_in_fp32: !ref <residual_in_fp32>
JEPA: !new:modules.jepa.MaskedSourceJEPA
    encoder: !ref <Encoder>
    context_model: !ref <JEPAContext>
    predictor_model: !ref <JEPAPredictor>
    channels: !ref <N_encoder_out>
    predictor_dim: !ref <jepa_predictor_dim>
    mask_ratio: !ref <jepa_mask_ratio>
    mask_span: !ref <jepa_mask_span>
    momentum: !ref <jepa_momentum>
    momentum_end: !ref <jepa_momentum_end>
    anneal_steps: !ref <jepa_anneal_steps>
optimizer: !name:torch.optim.Adam
    lr: !ref <lr>
    weight_decay: !ref <weight_decay>
loss: !name:speechbrain.nnet.losses.get_si_snr_with_pitwrapper
use_cosine_schedule: True
percent_lr: 0.01
lr_scheduler: !new:speechbrain.nnet.schedulers.ReduceLROnPlateau
    factor: 0.5
    patience: 2
    dont_halve_until_epoch: 30
epoch_counter: !new:speechbrain.utils.epoch_loop.EpochCounter
    limit: !ref <N_epochs>
modules:
    encoder: !ref <Encoder>
    decoder: !ref <Decoder>
    masknet: !ref <MaskNet>
    jepa: !ref <JEPA>
checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
    checkpoints_dir: !ref <save_folder>
    recoverables:
        encoder: !ref <Encoder>
        decoder: !ref <Decoder>
        masknet: !ref <MaskNet>
        jepa: !ref <JEPA>
        counter: !ref <epoch_counter>
        lr_scheduler: !ref <lr_scheduler>
train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
    save_file: !ref <train_log>
use_wandb: False
resume: False
wandb_logger: !name:speechbrain.utils.train_logger.WandBLogger
    initializer: !name:wandb.init
    entity: xj-audio
    project: !ref <project>
    name: !ref <experiment>
    dir: !ref <save_folder>
    reinit: true
    resume: !ref <resume>
